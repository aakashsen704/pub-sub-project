<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker>
    <marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#15803d"/></marker>
  </defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">Publish-Subscribe System using REST</text>

  <!-- Publisher -->
  <rect x="30" y="200" width="150" height="80" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="105" y="236" text-anchor="middle" font-size="16" font-weight="bold">Publisher</text>
  <text x="105" y="257" text-anchor="middle" font-size="12">curl / Swagger / Postman</text>

  <!-- Broker -->
  <rect x="270" y="90" width="300" height="340" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="420" y="118" text-anchor="middle" font-size="16" font-weight="bold">Central Broker</text>
  <text x="420" y="136" text-anchor="middle" font-size="12" fill="#4b5563">FastAPI - http://localhost:8000</text>

  <rect x="290" y="155" width="260" height="70" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="420" y="178" text-anchor="middle" font-size="13" font-weight="bold">REST endpoints</text>
  <text x="420" y="196" text-anchor="middle" font-size="11">POST /subscribe   DELETE /unsubscribe/{id}</text>
  <text x="420" y="212" text-anchor="middle" font-size="11">GET /subscribers   POST /publish</text>

  <rect x="290" y="240" width="260" height="55" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="420" y="262" text-anchor="middle" font-size="13" font-weight="bold">Subscriber Registry (in memory)</text>
  <text x="420" y="281" text-anchor="middle" font-size="11">{ id : callback_url }</text>

  <rect x="290" y="310" width="260" height="100" rx="8" fill="#ffffff" stroke="#6b7280"/>
  <text x="420" y="332" text-anchor="middle" font-size="13" font-weight="bold">Recipient selection + delivery</text>
  <text x="420" y="352" text-anchor="middle" font-size="11">Unicast: exactly 1 subscriber</text>
  <text x="420" y="368" text-anchor="middle" font-size="11">Multicast: selected subset</text>
  <text x="420" y="384" text-anchor="middle" font-size="11">Broadcast: all registered</text>
  <text x="420" y="402" text-anchor="middle" font-size="11" fill="#4b5563">async HTTPX, timeout, per-subscriber result</text>

  <!-- Subscribers -->
  <rect x="680" y="100" width="190" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="775" y="132" text-anchor="middle" font-size="15" font-weight="bold">Subscriber A</text>
  <text x="775" y="152" text-anchor="middle" font-size="12">:5001  POST /notify</text>
  <rect x="680" y="220" width="190" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="775" y="252" text-anchor="middle" font-size="15" font-weight="bold">Subscriber B</text>
  <text x="775" y="272" text-anchor="middle" font-size="12">:5002  POST /notify</text>
  <rect x="680" y="340" width="190" height="80" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="775" y="372" text-anchor="middle" font-size="15" font-weight="bold">Subscriber C</text>
  <text x="775" y="392" text-anchor="middle" font-size="12">:5003  POST /notify</text>

  <!-- Arrows: publish (blue) -->
  <line x1="180" y1="240" x2="268" y2="240" stroke="#1d4ed8" stroke-width="3" marker-end="url(#blue)"/>
  <text x="224" y="228" text-anchor="middle" font-size="11" fill="#1d4ed8">POST /publish</text>
  <!-- Arrows: callbacks (green) -->
  <line x1="570" y1="330" x2="678" y2="150" stroke="#15803d" stroke-width="3" marker-end="url(#green)"/>
  <line x1="570" y1="350" x2="678" y2="260" stroke="#15803d" stroke-width="3" marker-end="url(#green)"/>
  <line x1="570" y1="370" x2="678" y2="380" stroke="#15803d" stroke-width="3" marker-end="url(#green)"/>
  <text x="640" y="312" font-size="11" fill="#15803d">HTTP POST /notify</text>

  <!-- Subscribe arrow (dashed) -->
  <path d="M 720 180 L 720 200 L 600 200 L 600 267 L 552 267" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#blue)"/>
  <text x="728" y="214" font-size="11" fill="#4b5563">POST /subscribe</text>

  <!-- Legend -->
  <line x1="40" y1="470" x2="80" y2="470" stroke="#1d4ed8" stroke-width="3"/>
  <text x="90" y="474" font-size="12">Event publishing (publisher to broker)</text>
  <line x1="340" y1="470" x2="380" y2="470" stroke="#15803d" stroke-width="3"/>
  <text x="390" y="474" font-size="12">Callback delivery (broker to subscribers)</text>
  <line x1="660" y1="470" x2="700" y2="470" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="710" y="474" font-size="12">Registration</text>
</svg>
